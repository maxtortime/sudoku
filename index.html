<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#1a1a1a" />
<title>미니게임 모음</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --ink: #1f2328;
    --muted: #6b7280;
    --line: #e3e5e8;
    --accent: #1f5fd6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1c1f24;
      --ink: #e8eaed;
      --muted: #9aa1a9;
      --line: #2c3138;
      --accent: #6ea8ff;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding: 32px 20px 64px;
    max-width: 720px;
    margin: 0 auto;
  }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.01em; }
  p.lead { color: var(--muted); margin: 0 0 28px; }
  ul.games { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a.card {
    display: block; padding: 18px 18px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px;
    color: var(--ink); text-decoration: none;
    transition: transform .08s ease, border-color .15s ease;
  }
  a.card:hover { border-color: var(--accent); }
  a.card:active { transform: scale(0.99); }
  .title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .desc { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <h1>미니게임 모음</h1>
  <p class="lead">광고에서 본 그 게임들, 한 페이지에서.</p>
  <ul class="games">
    <li><a class="card" href="sudoku/index.html">
      <div class="title">스도쿠</div>
      <div class="desc">9×9 클래식 스도쿠. 메모, 힌트, 통계 지원.</div>
    </a></li>
    <li><a class="card" href="magicsort/index.html">
      <div class="title">매직 소트</div>
      <div class="desc">병에 든 액체를 옮겨서 색깔별로 분류하는 퍼즐.</div>
    </a></li>
  </ul>
</body>
</html>
